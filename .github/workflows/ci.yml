# The parity tests are the only thing guaranteeing the TypeScript canonical
# serialisers still agree with the Rust ones byte for byte. If they drift, every
# signature silently stops verifying -- so they need to run on every push, not
# when someone remembers.
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p backend
      - run: cargo build --release --target wasm32-unknown-unknown -p backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test          # cross-language parity vs the Rust serialisers
      - run: npm run build

  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # Independent reimplementation of verify/SPEC.md checked against the
      # canister's own published golden vectors.
      - run: node selftest.mjs

  # An independent build on GitHub's machines. Its SHA-256 must equal both a
  # local ./scripts/build-backend.sh and the live module hash:
  #   dfx canister info 7d7lc-byaaa-aaaah-qusjq-cai --network ic
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-backend.sh
      - run: |
          echo "### backend.wasm" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum artifacts/backend.wasm >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-wasm
          path: artifacts/backend.wasm
